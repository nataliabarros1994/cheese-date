[project]
name = "cheesedate"
version = "0.1.0"
description = "Automacao de planilhas Excel e dashboards para producao de laticinios"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0",
    "openpyxl>=3.1",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
